name: Claude (auf Zuruf)

# Startet nur, wenn der Repo-Besitzer in einem Issue oder Pull Request «@claude» schreibt.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # Public repo: only the owner may start the agent, nobody else.
    if: >-
      (github.event_name == 'issues' &&
        github.event.issue.author_association == 'OWNER' &&
        contains(github.event.issue.body, '@claude')) ||
      (github.event_name != 'issues' &&
        github.event.comment.author_association == 'OWNER' &&
        contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --allowedTools "Bash(npm run check),Bash(npm run test:*),Bash(npm run lint),Bash(npm run typecheck),Bash(npm run build),Bash(npm ci),Bash(npx shadcn add:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git checkout:*),Bash(git branch:*),Edit,Write,Read,Glob,Grep"
            --append-system-prompt "Du arbeitest in einem GitHub-Issue statt im Terminal. Halte dich an CLAUDE.md, AGENTS.md und DESIGN.md. Ablauf je Feature, immer in dieser Reihenfolge, je Schritt ein Kommentar: 1) Schritte aus .claude/commands/spec.md (Modus Feature, Beschreibung aus dem Issue), dann aufhören und auf Freigabe warten. 2) Nach einem Kommentar mit Freigabe: .claude/commands/plan.md, dann aufhören. 3) Nach Freigabe des Plans: alle Tasks nach .claude/commands/task.md nacheinander bauen, Test zuerst, npm run check grün, dann einen Pull Request eröffnen und die Review-Tabelle nach .claude/commands/review.md in den Pull Request schreiben. Arbeite immer auf einem eigenen Branch, nie direkt auf main, nie veröffentlichen, nie mergen. Ändere nie .github/, .claude/, scripts/, AGENTS.md, DESIGN.md, docs/STACK.md, vite.config.ts oder tsconfig*.json. Antworte auf Deutsch (ss statt ß), kurz."
